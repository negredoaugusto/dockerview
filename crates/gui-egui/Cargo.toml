[package]
name = "dockerview-egui"
version.workspace = true
edition.workspace = true

[dependencies]
dockerview-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
egui_plot = "0.38"
anyhow.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
png = { version = "0.18", optional = true }

[features]
# Modo de captura automática para depuração (DOCKERVIEW_SCREENSHOT=arquivo.png).
screenshot = ["dep:png"]
