[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui-egui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dockerview-core = { path = "crates/core" }
bollard = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
flume = "0.12"
futures-util = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
